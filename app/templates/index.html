<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BRIGADA-IA — Sistema de Gestão de Validade para Açougue Varejo. Painel Super Admin, controle de produtos Aves, Suíno, Bovino e Pescado.">
  <meta name="theme-color" content="#060918">
  <title>BRIGADA-IA — Brigada de Validade</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=1.2.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.svg') }}">
  <script>
    (function() {
      const theme = localStorage.getItem('brigada-theme');
      if (theme === 'light') {
        document.documentElement.classList.add('light-theme');
      }
    })();
  </script>
  <!-- HTML5 QRCode Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
  <!-- App root — SPA injected here -->
  <div id="app-root"></div>

  <!-- Scanner Modal Global -->
  <div id="scanner-modal-overlay" class="modal-overlay" style="display: none; z-index: 9999;">
    <div class="modal modal--sm" style="text-align: center;">
      <div class="modal-header">
        <h2 class="modal-title">Escanear Código</h2>
        <button class="modal-close" id="close-scanner-btn">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="modal-body">
        <div id="scanner-reader" style="width: 100%; min-height: 250px;"></div>
        <p class="text-secondary" style="margin-top: 1rem; font-size: 0.9rem;">
          Aponte a câmera para o código (fábrica ou balança).
        </p>
      </div>
    </div>
  </div>

  <!-- Product View Modal Global -->
  <div id="product-view-modal-overlay" class="modal-overlay" style="display: none; z-index: 9999;">
    <div class="modal" style="max-width: 500px;">
      <div class="modal-header">
        <h2 class="modal-title">Detalhes do Produto</h2>
        <button class="modal-close" id="close-product-view-btn">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="modal-body">
        <div id="product-view-content" style="display: grid; gap: 1rem;">
          <!-- Content injected via JS -->
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn--primary" id="btn-close-product-view" style="width: 100%;">Fechar</button>
      </div>
    </div>
  </div>

  <!-- Core data must load first -->
  <script src="{{ url_for('static', filename='js/data.js') }}?v=1.3.3"></script>
  <script src="{{ url_for('static', filename='js/auth.js') }}?v=1.3.3"></script>

  <!-- Feature modules -->
  <script src="{{ url_for('static', filename='js/dashboard.js') }}?v=1.3.3"></script>
  <script src="{{ url_for('static', filename='js/products.js') }}?v=1.3.3"></script>
  <script src="{{ url_for('static', filename='js/pereciveis.js') }}?v=1.3.3"></script>
  <script src="{{ url_for('static', filename='js/padaria.js') }}?v=1.3.3"></script>
  <script src="{{ url_for('static', filename='js/hortifruti.js') }}?v=1.3.3"></script>
  <script src="{{ url_for('static', filename='js/mercearia.js') }}?v=1.3.3"></script>
  <script src="{{ url_for('static', filename='js/users.js') }}?v=1.3.3"></script>
  <script src="{{ url_for('static', filename='js/notifications.js') }}?v=1.3.3"></script>
  <script src="{{ url_for('static', filename='js/chambers.js') }}?v=1.3.3"></script>
  <script src="{{ url_for('static', filename='js/product_list.js') }}?v=1.3.3"></script>

  <!-- Main router (bootstraps the app) -->
  <script src="{{ url_for('static', filename='js/catalog.js') }}?v=1.0.0"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}?v=1.3.3"></script>

  <!-- Service Worker registration for PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Service Worker registrado (escopo):', reg.scope))
          .catch(err => console.error('Erro ao registrar Service Worker:', err));
      });
    }
  </script>
</body>
</html>
