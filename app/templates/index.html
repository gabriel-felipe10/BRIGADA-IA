<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BRIGADA-IA — Sistema de Gestão de Validade para Açougue Varejo. Painel Super Admin, controle de produtos Aves, Suíno, Bovino e Pescado.">
  <meta name="theme-color" content="#060918">
  <title>BRIGADA-IA — Brigada de Validade</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=1.2.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.svg') }}">
  <script>
    (function() {
      const theme = localStorage.getItem('brigada-theme');
      if (theme === 'light') {
        document.documentElement.classList.add('light-theme');
      }
    })();
  </script>
</head>
<body>
  <!-- App root — SPA injected here -->
  <div id="app-root"></div>

  <!-- Core data must load first -->
  <script src="{{ url_for('static', filename='js/data.js') }}?v=1.3.0"></script>
  <script src="{{ url_for('static', filename='js/auth.js') }}?v=1.3.0"></script>

  <!-- Feature modules -->
  <script src="{{ url_for('static', filename='js/dashboard.js') }}?v=1.3.0"></script>
  <script src="{{ url_for('static', filename='js/products.js') }}?v=1.3.0"></script>
  <script src="{{ url_for('static', filename='js/pereciveis.js') }}?v=1.3.0"></script>
  <script src="{{ url_for('static', filename='js/padaria.js') }}?v=1.3.0"></script>
  <script src="{{ url_for('static', filename='js/hortifruti.js') }}?v=1.3.0"></script>
  <script src="{{ url_for('static', filename='js/mercearia.js') }}?v=1.3.0"></script>
  <script src="{{ url_for('static', filename='js/users.js') }}?v=1.3.0"></script>
  <script src="{{ url_for('static', filename='js/notifications.js') }}?v=1.3.0"></script>
  <script src="{{ url_for('static', filename='js/chambers.js') }}?v=1.3.0"></script>
  <script src="{{ url_for('static', filename='js/product_list.js') }}?v=1.3.0"></script>

  <!-- Main router (bootstraps the app) -->
  <script src="{{ url_for('static', filename='js/app.js') }}?v=1.3.0"></script>

  <!-- Service Worker registration for PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Service Worker registrado (escopo):', reg.scope))
          .catch(err => console.error('Erro ao registrar Service Worker:', err));
      });
    }
  </script>
</body>
</html>
