<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BRIGADA-IA — Sistema de Gestão de Validade para Açougue Varejo. Painel Super Admin, controle de produtos Aves, Suíno, Bovino e Pescado.">
  <meta name="theme-color" content="#060918">
  <title>BRIGADA-IA — Brigada de Validade</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=1.2.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.svg') }}">
  <script>
    (function() {
      const theme = localStorage.getItem('brigada-theme');
      if (theme === 'light') {
        document.documentElement.classList.add('light-theme');
      }
    })();
  </script>
  <!-- HTML5 QRCode Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <!-- jsPDF and AutoTable for native robust vector PDFs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <!-- Three.js Importmap for 3D Digital Twin -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.168.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.168.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="print-area"></div>
  <!-- App root — SPA injected here -->
  <div id="app-root"></div>

  <!-- Scanner Modal Global -->
  <div id="scanner-modal-overlay" class="modal-overlay" style="display: none; z-index: 9999;">
    <div class="modal modal--sm" style="text-align: center;">
      <div class="modal-header">
        <h2 class="modal-title">Escanear Código</h2>
        <button class="modal-close" id="close-scanner-btn">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="modal-body">
        <div id="scanner-reader" style="width: 100%; min-height: 250px;"></div>
        <p class="text-secondary" style="margin-top: 1rem; font-size: 0.9rem;">
          Aponte a câmera para o código (fábrica ou balança).
        </p>
      </div>
    </div>
  </div>

  <!-- Product View Modal Global -->
  <div id="product-view-modal-overlay" class="modal-overlay" style="display: none; z-index: 9999;">
    <div class="modal" style="max-width: 520px; max-height: 90vh; display: flex; flex-direction: column;">
      <div class="modal-header" style="flex-shrink: 0;">
        <h2 class="modal-title">Detalhes do Produto</h2>
        <button class="modal-close" id="close-product-view-btn">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="modal-body" style="overflow-y: auto; flex: 1;">
        <div id="product-view-content" style="display: grid; gap: 1rem;">
          <!-- Content injected via JS -->
        </div>
      </div>
      <div class="modal-footer" style="flex-shrink: 0; display: flex; gap: 8px; flex-wrap: wrap;">
        <button class="btn" id="btn-whatsapp-product-view" title="Enviar dados deste produto direto para o WhatsApp do perfil" style="flex: 1; min-width: 130px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 700; background: #25D366; color: #ffffff; border: none; border-radius: 8px; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 2px 8px rgba(37,211,102,0.25);" onmouseover="this.style.background='#22bf5b';" onmouseout="this.style.background='#25D366';">
          <span style="font-size: 1.15rem;">💬</span> WhatsApp Perfil
        </button>
        <button class="btn btn--outline" id="btn-send-to-cracha-footer" style="flex: 1; min-width: 125px; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600;">🏷️ Enviar p/ Crachá</button>
        <button class="btn btn--primary" id="btn-cracha-product-view" style="flex: 1; min-width: 125px; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 700;">🖨️ Imprimir Crachá</button>
        <button class="btn btn--outline" id="btn-close-product-view" style="padding: 0 16px;">Fechar</button>
      </div>
    </div>
  </div>

  <!-- Decision Support Modal Global (Perecíveis - Intervenção Humana) -->
  <div id="decision-modal-overlay" class="modal-overlay" style="display: none; z-index: 9999;">
    <div class="modal" style="max-width: 620px; max-height: 92vh; display: flex; flex-direction: column; width: 95%;">
      <div class="modal-header" style="flex-shrink: 0; padding: 1rem 1.25rem;">
        <h2 class="modal-title" style="display: flex; align-items: center; gap: 8px; font-size: 1.15rem;">
          <span style="font-size: 1.3rem;">🤖</span> <span>Apoio à Decisão — Perecíveis</span>
        </h2>
        <button class="modal-close" id="close-decision-modal-btn">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="modal-body" id="decision-modal-body" style="overflow-y: auto; flex: 1; padding: 1.25rem;">
        <!-- Injetado dinamicamente via window.BrigadaUI.showDecisionModal -->
      </div>
      <div class="modal-footer" id="decision-modal-footer" style="flex-shrink: 0; display: flex; gap: 8px; flex-wrap: wrap; padding: 0.75rem 1.25rem;">
        <!-- Botões de ação com intervenção humana -->
      </div>
    </div>
  </div>

  <!-- Twin Cracha Modal Global (Gêmeo Digital - Visualizar, Editar e Imprimir) -->
  <div id="twin-cracha-modal-overlay" class="modal-overlay" style="display: none; z-index: 10000;">
    <div class="modal" style="max-width: 660px; max-height: 94vh; display: flex; flex-direction: column; width: 95%;">
      <div class="modal-header" style="flex-shrink: 0; padding: 1rem 1.25rem;">
        <h2 class="modal-title" style="display: flex; align-items: center; gap: 8px; font-size: 1.15rem;">
          <span style="font-size: 1.3rem;">🏷️</span> <span>Crachá de Identificação — Gêmeo Digital</span>
        </h2>
        <button class="modal-close" id="close-twin-cracha-modal-btn">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="modal-body" id="twin-cracha-modal-body" style="overflow-y: auto; flex: 1; padding: 1.25rem;">
        <!-- Injetado dinamicamente via window.BrigadaUI.showEditableCrachaModal -->
      </div>
      <div class="modal-footer" id="twin-cracha-modal-footer" style="flex-shrink: 0; display: flex; gap: 8px; flex-wrap: wrap; padding: 0.75rem 1.25rem;">
        <!-- Botões de Ação -->
      </div>
    </div>
  </div>

    <!-- Signature Modal Global -->
  <div id="signature-modal-overlay" class="modal-overlay" style="display: none; z-index: 9999;">
    <div class="modal" style="max-width: 600px;">
      <div class="modal-header">
        <h2 class="modal-title">✍️ Assinatura do Relatório</h2>
        <button class="modal-close" id="close-signature-btn">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="modal-body" style="display: flex; flex-direction: column; gap: 1.2rem;">
        <p class="text-secondary" style="font-size: 0.9rem; margin-top: -0.5rem; color: #94a3b8;">
          Selecione ou digite os nomes e desenhe as assinaturas diretamente na tela para gerar o PDF.
        </p>
        
        <!-- Responsável Contagem -->
        <div class="signature-section" style="border: 1px solid var(--glass-border); border-radius: 8px; padding: 1rem; background: rgba(255,255,255,0.02);">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
            <label style="font-weight: 600; font-size: 0.95rem; color: var(--text-primary);">1. Responsável pela Contagem</label>
            <button class="btn btn--sm btn--ghost" id="clear-sig-1-btn" style="padding: 2px 8px; font-size: 0.8rem;">Limpar</button>
          </div>
          <input type="text" id="sig-user-1-input" list="sig-users-list" class="select-control" style="width: 100%; margin-bottom: 0.5rem; background: var(--bg-primary); color: var(--text-primary); border: 1px solid rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 6px;" placeholder="Selecione ou digite o nome...">
          <div style="background: #ffffff; border-radius: 6px; border: 1px solid #cbd5e1; height: 120px; overflow: hidden; position: relative;">
            <canvas id="sig-canvas-1" width="500" height="120" style="width: 100%; height: 100%; cursor: crosshair; display: block;"></canvas>
          </div>
        </div>

        <!-- Liderança -->
        <div class="signature-section" style="border: 1px solid var(--glass-border); border-radius: 8px; padding: 1rem; background: rgba(255,255,255,0.02);">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
            <label style="font-weight: 600; font-size: 0.95rem; color: var(--text-primary);">2. Assinatura da Liderança</label>
            <button class="btn btn--sm btn--ghost" id="clear-sig-2-btn" style="padding: 2px 8px; font-size: 0.8rem;">Limpar</button>
          </div>
          <input type="text" id="sig-user-2-input" list="sig-users-list" class="select-control" style="width: 100%; margin-bottom: 0.5rem; background: var(--bg-primary); color: var(--text-primary); border: 1px solid rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 6px;" placeholder="Selecione ou digite o nome...">
          <div style="background: #ffffff; border-radius: 6px; border: 1px solid #cbd5e1; height: 120px; overflow: hidden; position: relative;">
            <canvas id="sig-canvas-2" width="500" height="120" style="width: 100%; height: 100%; cursor: crosshair; display: block;"></canvas>
          </div>
        </div>

        <!-- Datalist global compartilhado para os inputs -->
        <datalist id="sig-users-list">
          <!-- Opções preenchidas dinamicamente pelo JS -->
        </datalist>

        <!-- Option to print logs -->
        <div style="margin-top: 0.5rem; display: flex; align-items: center; gap: 10px; padding: 0.5rem 1rem; background: rgba(99,102,241,0.05); border: 1px solid rgba(99,102,241,0.2); border-radius: 8px;">
          <input type="checkbox" id="include-logs-checkbox" checked style="cursor: pointer; width: 18px; height: 18px; border-radius: 4px; accent-color: var(--accent);">
          <label for="include-logs-checkbox" style="cursor: pointer; color: var(--text-primary); font-size: 0.9rem; font-weight: 500; user-select: none;">Imprimir com o histórico de alterações (Logs)</label>
        </div>
      </div>
      <div class="modal-footer" style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1rem; display: flex; gap: 0.5rem; justify-content: flex-end;">
        <button class="btn btn--ghost" id="btn-cancel-signature">Cancelar</button>
        <button class="btn btn--primary" id="btn-confirm-signature">Confirmar e Gerar PDF</button>
      </div>
    </div>
  </div>

  <!-- Core data must load first -->
  <script src="{{ url_for('static', filename='js/data.js') }}?v=2.0.0"></script>
  <script src="{{ url_for('static', filename='js/auth.js') }}?v=2.0.0"></script>

  <!-- Feature modules -->
  <script src="{{ url_for('static', filename='js/dashboard.js') }}?v=2.0.0"></script>
  <script src="{{ url_for('static', filename='js/products.js') }}?v=2.0.0"></script>
  <script src="{{ url_for('static', filename='js/especiais.js') }}?v=10.2.0"></script>
  <script src="{{ url_for('static', filename='js/pereciveis.js') }}?v=2.0.0"></script>
  <script src="{{ url_for('static', filename='js/users.js') }}?v=2.0.0"></script>
  <script src="{{ url_for('static', filename='js/notifications.js') }}?v=2.0.0"></script>
  <script src="{{ url_for('static', filename='js/chambers.js') }}?v=2.6.1"></script>
  <script src="{{ url_for('static', filename='js/piso_loja.js') }}?v=2.0.0"></script>
  <script src="{{ url_for('static', filename='js/product_list.js') }}?v=2.0.0"></script>
  <script src="{{ url_for('static', filename='js/produtos_sem_nota.js') }}?v=2.0.0"></script>
  <script src="{{ url_for('static', filename='js/quebra.js') }}?v=2.0.0"></script>
  <script src="{{ url_for('static', filename='js/cracha.js') }}?v=2.6.1"></script>
  <script src="{{ url_for('static', filename='js/resumo_mensal.js') }}?v=2.0.0"></script>
  <script src="{{ url_for('static', filename='js/verse_of_the_day.js') }}?v=2.0.0"></script>
  <script src="{{ url_for('static', filename='js/twin3d.js') }}?v=1.0.0"></script>

  <!-- Main router (bootstraps the app) -->
  <script src="{{ url_for('static', filename='js/catalog.js') }}?v=2.0.0"></script>
  <script src="{{ url_for('static', filename='js/conciliacao.js') }}?v=2.0.0"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}?v=2.6.0"></script>

  <!-- Service Worker registration for PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => {
            console.log('Service Worker registrado (escopo):', reg.scope);
            reg.update();
          })
          .catch(err => console.error('Erro ao registrar Service Worker:', err));
      });
    }
  </script>
</body>
</html>
