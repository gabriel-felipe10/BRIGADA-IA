<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BRIGADA-IA — Sistema multiagente de validação de dados com inteligência artificial">
    <meta name="theme-color" content="#06081a">
    <title>{% block title %}BRIGADA-IA{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=1.2.0">
</head>
<body>
    <div id="print-area"></div>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header__brand">
                <img src="{{ url_for('static', filename='icon.svg') }}" alt="Logo" style="width: 28px; height: 28px; border-radius: 6px; object-fit: cover;">
                <div>
                    <h1 class="header__title">BRIGADA-IA</h1>
                    <p class="header__subtitle">Sistema de Validação Inteligente</p>
                </div>
            </div>
            <div class="header__status" id="system-status">
                <span class="header__status-dot"></span>
                Sistema Online
            </div>
        </header>

        <!-- Navigation -->
        <nav class="nav">
            <a href="/" class="nav__link {% if request.path == '/' %}nav__link--active{% endif %}" id="nav-dashboard">
                📊 Dashboard
            </a>
            <a href="/logs" class="nav__link {% if request.path == '/logs' %}nav__link--active{% endif %}" id="nav-logs">
                📋 Logs de Auditoria
            </a>
        </nav>

        <!-- Main Content -->
        <main>
            {% block content %}{% endblock %}
        </main>

        <!-- Footer -->
        <footer style="text-align: center; padding: 2rem 0 1rem; color: var(--text-tertiary); font-size: 0.75rem;">
            BRIGADA-IA v1.0.0 · Brigada de Validade · {{ now if now else '2026' }}
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
